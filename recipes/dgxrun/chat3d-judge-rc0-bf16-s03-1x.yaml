# @dgxrun/chat3d-judge-rc0-bf16-s03-1x — chat3d judge rc0, BF16, PINNED TO spark-03.
#
# THE SAME-NODE CONTROL ARM. It exists for one reason: every precision comparison
# in chat3d #126 so far has been cross-node, and the node term is larger than the
# effect being measured.
#
#   rc0 BF16  (spark-01)  5 FP / 11 FF
#   rc0 NVFP4 (spark-03)  7 FP / 25 FF
#   rc1 NVFP4 (spark-03)  9 FP / 14 FF
#   rc1 BF16  (spark-03)  <- measured with chat3d-judge-rc1-bf16-1x
#
# rc0-NVFP4 differed from rc0-BF16 on 31 of 511 items = 6.1%, and two nodes running
# BYTE-IDENTICAL models already diverge ~7.4% here, cause unexplained (#96). So that
# 6.1% sits INSIDE the node envelope and does not establish a precision cost.
# Running rc0-BF16 HERE, on spark-03, closes it: it makes
#   rc0-BF16 vs rc1-BF16    (both spark-03)  and
#   rc0-NVFP4 vs rc1-NVFP4  (both spark-03)
# two clean same-node pairs, and the precision question answerable within each node.
#
# ⚠ IT PUBLISHES chat3d-judge-rc0-bf16-s03, NOT chat3d-judge-rc0. The production
# vlm_eval endpoint is chat3d-judge-rc0 on spark-01 and must stay the sole member of
# that name — deployments sharing a published name are POOLED and round-robined, so
# reusing it would silently spread production traffic across two nodes and reintroduce
# the very node variance this arm exists to measure.
#
# MODEL IS THE BARE REPO ID, deliberately — identical to @dgxrun/chat3d-judge-rc0.
# A control arm must load the SAME BYTES as the arm it controls for, and sharing the
# id guarantees identical offline resolution. Do not "improve" this to a pinned path
# unless the spark-01 recipe is pinned in the same commit.
#
# THE DIFF AGAINST @dgxrun/chat3d-judge-rc0-1x IS TWO LINES: served_model_name and
# description. Nothing else — same weights, same window, same nst, same MTP base
# head, same container. That is the point.
#
# FREE BONUS WHILE THIS RUNS: with chat3d-judge-rc0 on spark-01 and this on spark-03
# simultaneously — same weights, same flags, different nodes — paired requests to the
# two endpoints measure the CROSS-NODE divergence for this model directly, which has
# only ever been estimated at ~7.4% from another model. Capture content hashes on
# both before stopping either; the chance has been missed twice already.
#
# ~11 tok/s warm, ~6.8 on the first call. Discard rep 1.
recipe_version: "2"
runner: dgxrun
model: danielkreuzhofer/chat3d-judge-rc0
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:2026081501
description: chat3d judge rc0 BF16 pinned to spark-03 — same-node control arm, NOT the production endpoint

defaults:
  port: 8000
  host: 0.0.0.0

  # One Spark. 54.7 GB of BF16 weights fit a 124,546 MiB GB10 without sharding,
  # and a judge screen wants no inter-node fabric in the path.
  tensor_parallel: 1

  # 0.88 is the BF16 reference's value and the one the fleet's startup guard is
  # known to clear — vLLM compares gmu × total against CUDA-visible free, which
  # sits ~7 GiB below MemFree.
  gpu_memory_utilization: 0.88

  # Judge calls are 8 images + guided JSON, not long prose. 262144 is what the
  # BF16 reference pins, and max_model_len taxes every request on this hardware
  # as a cliff — if the screen's prompts are far below this, lowering it is the
  # cheapest throughput win available. Worth measuring, not assuming.
  max_model_len: 262144

  # Asked for explicitly. Also the reference's value.
  max_num_seqs: 8

  # Chunked prefill's chunk size. 2048 here is load-bearing on this fleet for a
  # different model (the b12x indexer prewarm workspace scales with it), and is
  # what the reference pins; kept for consistency.
  max_num_batched_tokens: 2048

  num_speculative_tokens: 5

  # The gateway publishes whatever the runtime answers to. A displayName on the
  # deploy overrides this via --served-model-name, so POSTing with
  # displayName: chat3d-judge-rc0 makes the published name match regardless.
  served_model_name: chat3d-judge-rc0-bf16-s03

command: |
  vllm serve {model} \
      --served-model-name {served_model_name} \
      --host {host} \
      --port {port} \
      --tensor-parallel-size {tensor_parallel} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-auto-tool-choice \
      --tool-call-parser qwen3_coder \
      --reasoning-parser qwen3 \
      --generation-config auto \
      --default-chat-template-kwargs '{"reasoning_effort":"medium"}' \
      --speculative-config '{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}'

# THIS IS AN EXACT MIRROR of @dgxrun/qwen3.8-27b-nvfp4, the incumbent rc0 was
# screened against. Stripped of comments the two files differ in three lines —
# `model`, `served_model_name`, `description` — and nothing else. Diff them before
# changing either: the screen's value rests on weights alone differing.
#
# IT WAS NOT ALWAYS SO, AND THE REASON IS WORTH KEEPING.
#
# The first merged checkpoint (32e8690) had no MTP head: 1,184 tensors against the
# base's 1,199, the 15 absent ones exactly `mtp.fc.weight` and `mtp.layers.0.*`.
# With the incumbent's --speculative-config in place, vLLM loaded the main model
# and then died in drafter load with "Following weights were not initialized from
# checkpoint". rc0's first serving run was therefore MTP-off, and both arms of the
# 125-item screen ran that way.
#
# The cause is upstream and silent in BOTH directions: **transformers has no MTP
# implementation for this architecture at all**. The only mentions of `mtp` in its
# modeling file are two `_keys_to_ignore_on_load_unexpected` regexes on the shared
# base class, so any path loading through Qwen3_5ForConditionalGeneration — merge,
# quantize, convert — drops the head with no warning. A parity check guarding one
# merge script does not generalise to the next path.
#
# This recipe now serves 6cbd3011, which carries the head (three shards, the third
# an 849 MB / 424.7M-param MTP module), so the flag works and the mirror is whole.
#
# THE DRAFTER IS TRANSPLANTED, which is a throughput caveat and nothing more.
# 6cbd3011's head is the BASE model's, copied verbatim — never instantiated during
# training, so it learned to predict from base hidden states and is now fed states
# the LoRA merge has changed. Cosine between base and merged final hidden states —
# the exact tensor `fc` consumes — is 0.79 over 40k real positions.
#
# MEASURED on this deployment, 9 judge calls, runaways excluded (2026-09-25):
#
#                        rc0 (transplanted)   incumbent (aligned)
#   acceptance length          2.93                  4.39
#   acceptance rate           42.9%                 68.3%
#   per-position       70.4/57.4/31.8/20.7/13.1   86.9/75.4/65.9/58.3/52.2
#
# So ~33% fewer tokens per verification step, and a much steeper decay: by position
# 2 rc0 keeps under half what the incumbent keeps. MTP is still worth having — it
# lifts this workload from 3.4-3.8 to 7.5 tok/s, about 2x — and an aligned head
# would be worth roughly another 50% (2.93 -> 4.39 tokens per step at similar cost).
#
# `num_speculative_tokens: 5` is consequently over-provisioned HERE: positions 3-4
# return 20.7% and 13.1% and cost compute to propose. Lowering it to 3 would
# recover overhead at little loss — but it would break the three-line diff with the
# incumbent, so leave it while that comparison matters.
#
# None of this can cost quality: the target model verifies every draft, so a stale
# drafter loses speed and nothing else.
#
# MEASUREMENT NOTE, because this number is easy to get wrong by a third. A judge
# call that runs away to the token cap emits highly repetitive text, which drafts
# far too easily: the same probe gave 3.74 when one runaway supplied 87% of tokens,
# 3.16 at 39%, and 2.93 with runaways excluded per-rep. Attribute acceptance per
# call and drop any rep whose finish_reason is "length".
#
# Three facts for anyone touching this head, from vLLM's Qwen3_5MTP
# (vllm/model_executor/models/qwen3_5_mtp.py), the only implementation that exists:
#   - The trunk is a Gated DeltaNet / attention HYBRID, only 16 of 64 layers
#     full-attention, but `mtp.layers.0` IS full-attention. vLLM sets
#     mtp_start_layer_idx = num_hidden_layers = 64, so a port must make layer_types
#     report full_attention at index 64 or it builds the wrong layer type.
#   - `mtp.fc` must stay BF16 in an NVFP4 checkpoint. ModelOpt has been omitting it
#     from hf_quant_config.json exclude_modules and vLLM force-unquantizes it as a
#     workaround (vllm#38650, NVIDIA/Model-Optimizer#1124). MTP-in-BF16 beside
#     quantized weights is the convention, not a packaging preference.
#   - The head shares `embed_tokens` and `lm_head` with the trunk — no
#     mtp.embed_tokens, no mtp.lm_head — per mtp_use_dedicated_embeddings: false.
#
# FLASHINFER is not a recipe flag: the incumbent carries no attention-backend flag
# and no env block, so the backend is the container default, and rc0 uses the same
# tag. Adding one here alone would be the serving-shape difference this file avoids.
