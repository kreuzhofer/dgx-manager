# @dgxrun/qwen3.8-27b-bf16 — Qwen3.8-27B at BF16 reference weights, on ONE Spark.
#
# 27B hybrid-attention multimodal dense model, Apache 2.0, released 2026-08-05..13.
# 64 layers of which only 16 are full attention (full_attention_interval: 4); the other
# 48 are linear/GDN carrying a constant-size recurrent state. Native context 262,144.
#
# WHY BF16 AND NOT THE FP8 RECIPE: @official/qwen3.8-27b-fp8-mtp-vllm already exists
# upstream (recipe-registry, 2026-08-14) and is the right choice for SERVING. This recipe
# exists to MEASURE. At 51.7 GiB the reference weights fit one 121.6 GB GB10 outright, so
# we do not have to accept a quantization confound — the same argument muse-glimmer-30b.yaml
# makes for itself. Benchmarking an FP8 Qwen against a BF16 Muse Glimmer would bias the
# comparison in Glimmer's favour and make any Qwen loss unattributable.
#
# It also sidesteps every sm_121 quantization-kernel question at once: the blockwise-FP8
# DeepGEMM family-12 gate (vllm#51884), NVFP4 Marlin fallback, and MXFP4 (which does not
# load on NVIDIA at all). Lowest-risk first boot as well as the most rigorous measurement.
#
# NO NEW vLLM SUPPORT WAS NEEDED. This checkpoint declares Qwen3_5ForConditionalGeneration —
# the same class Qwen3.5 and Qwen3.6 declare — registered since vLLM v0.17.0 (2026-03-07)
# via vllm-project/vllm#34110 (merged 2026-02-09). Its config.json is field-for-field
# identical to Qwen3.6-27B's. The multimodal processor is native in-tree, so unlike the
# Qwen3.6 recipe this needs NO --trust-remote-code and no chat-template override.
#
# CONTAINER: the eugr nightly, pinned to a DATED tag for reproducible benchmark numbers.
# NOTE: `-tf5` is now a DEPRECATED ALIAS of `-nightly` (identical digest, per the dgx-vllm
# README) — the tf5 comment block in muse-glimmer-30b.yaml is historically out of date.
# b12x is unnecessary: this is a dense model, so none of b12x's sparse-MLA/MoE kernels apply.
# If load fails with "ParallelLMHead has no output_size_per_partition" (vllm#52434, filed
# 2026-08-15 against main from #52147), drop back to :2026081201, which predates it.
recipe_version: "2"
runner: dgxrun
model: Qwen/Qwen3.8-27B
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:2026081501
description: Qwen3.8-27B BF16 reference weights, one Spark — the unquantized benchmark target

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1

  # 0.88, NOT 0.92: vLLM's startup guard compares gmu*total against CUDA-VISIBLE free, which
  # runs ~7 GiB below MemFree on these nodes. 0.90 was measured failing by 0.05 GiB on this
  # fleet (2026-07-10). Same value every GLM-5.2 recipe and muse-glimmer-30b.yaml use.
  gpu_memory_utilization: 0.88

  # Native trained context. Do NOT chase the 1M headline — that needs an explicit YaRN
  # --hf-overrides, and Qwen warns that because every open framework implements *static*
  # YaRN it degrades short-context quality. Agentic coding lives well inside 262K.
  #
  # This window is far cheaper than it looks: only 16 of 64 layers hold a KV cache, at
  # num_key_value_heads=4 x head_dim=256 x 2 (K+V) x 2 bytes = 64 KiB/token. ~55 GiB of KV
  # after 51.7 GiB of weights is ~800K tokens of pool, comfortably above the 262K per-request
  # cap (max_model_len bounds a request, it is not preallocated).
  # VERIFIED ON HARDWARE 2026-08-28: KV cache came out at 716,119 tokens (2.73x concurrency
  # at this window). The estimate above was close; the full native window is affordable.
  max_model_len: 262144

  # Matches the benchmark harness (-w 8 for mini-SWE-agent, num_concurrent=8 for lm-eval),
  # same as muse-glimmer-30b.yaml. The one published GB10 datapoint for this model
  # (sglang#34872, FP8) also ran concurrency 8.
  max_num_seqs: 8

  # 2048: muse-glimmer measured 2048 faster than 8192 under speculative decoding on this
  # hardware (17.56 vs 17.09 tok/s). The @official FP8 recipe uses 16384, but that recipe
  # is not spec-decode-tuned for GB10.
  #
  # CORRECTED 2026-08-31: this line previously also claimed "vLLM clamps to 2048 on its own
  # when spec decoding is on", copied from muse-glimmer-30b.yaml without checking. It is
  # false. vllm/config/vllm.py::_set_max_num_scheduled_tokens does
  # `max_num_scheduled_tokens = max_num_batched_tokens` with no clamp, and warns when the
  # result is < 8192 — so 2048 is what TRIGGERS the warning this deployment logs, not what
  # avoids it. The remaining justification is the measurement alone, which is 2.7% from
  # 3 runs with no stddev: weak evidence, worth re-measuring.
  max_num_batched_tokens: 2048

  # MTP weights ship INSIDE the checkpoint — 15 `mtp.*` keys in the BF16 safetensors index,
  # and Qwen3_5MTP is registered in vLLM. So unlike Muse Glimmer's DFlash there is NO separate
  # drafter to stage on NFS and no second model path to configure.
  #
  # 5, NOT the 3 that @official, the vLLM recipe page and the GB10 SGLang validation all use.
  # The margin is SMALL and NOT statistically significant — read this before quoting it.
  #
  # MEASURED 2026-08-29, one Spark. 500-token greedy decode, thinking disabled, decode timed
  # separately from prefill, PAIRED over 8 diverse prompts (prose, code, history, fiction,
  # biochem, shell, philosophy) because MTP acceptance is strongly CONTENT-dependent:
  #     nst=3  ->  10.99 tok/s   2.924 tokens/forward   accept 64.1%
  #     nst=5  ->  11.38 tok/s   3.369 tokens/forward   accept 47.4%   <- this config
  #     nst=7  ->   9.03 tok/s   3.077 tokens/forward   accept 29.7%   (clearly worse)
  # Paired delta of 5 over 3: +0.385 tok/s (+3.5%), 95% CI -0.27..+1.04, t(7)=1.39 — NOT
  # significant at p<0.05, though 6 of 8 prompts favour it. nst=7 is decisively worse and
  # needs no statistics. Keep 5; do NOT quote a speedup number from this.
  #
  # THE SIGN FLIPS WITH WORKLOAD, which is the part worth knowing. Extra draft passes are
  # paid whether or not they are accepted, so predictable text wins and unpredictable text
  # LOSES:  bash-script prompt 1.153x  |  creative fiction 0.909x.
  #
  # MTP drafts AUTOREGRESSIVELY: every extra speculative token costs a full pass over the
  # MTP layer PLUS the 2.54 GiB BF16 lm_head (vocab 248,320 x hidden 5120), about 5.8% of
  # the target model's bytes per draft step. That is why +15% tokens per forward (2.924 ->
  # 3.369) nets only ~3% decode, and why nst=7 goes backwards.
  #
  # nst > 1 works even though this checkpoint has mtp_num_hidden_layers: 1 — vLLM loops the
  # single MTP module rather than requiring one module per position. Verified by booting it.
  #
  # ⚠ METHOD — DO NOT REPEAT THIS MISTAKE. A greedy engine regenerates IDENTICAL text for a
  # given prompt, so repeating ONE prompt measures repeatability (spread <0.5%), not the
  # variance that matters. Across a restart the text diverges slightly and acceptance moves
  # with it: the SAME nst=5 config measured 10.40 and 9.65 tok/s on two boots of one prompt,
  # which is LARGER than the effect being chased. Content sd is ~12-17%. Sweep diverse
  # prompts and pair them; a single-prompt A/B on this model is worthless.
  #
  # No Qwen3.8-27B DFlash drafter exists on HF; DSpark (RadixArk/Qwen3.8-27B-DSpark) is
  # blocked on vllm#52197, still open.
  num_speculative_tokens: 5

  served_model_name: qwen3.8-27b

command: |
  vllm serve {model} \
      --served-model-name {served_model_name} \
      --host {host} \
      --port {port} \
      --tensor-parallel-size {tensor_parallel} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-auto-tool-choice \
      --tool-call-parser qwen3_coder \
      --reasoning-parser qwen3 \
      --generation-config auto \
      --default-chat-template-kwargs '{"reasoning_effort":"medium"}' \
      --speculative-config '{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}'

# ---------------------------------------------------------------------------------------
# DELIBERATELY OMITTED — each would either confound the measurement or is unverified:
#
#   --kv-cache-dtype fp8
#       @official sets it. It would quantize the KV cache, reintroducing exactly the
#       precision confound this recipe exists to avoid. Muse Glimmer does not set it either,
#       so leaving it off is also what keeps the two comparable.
#
#   --enable-prefix-caching
#       CORRECTION (measured 2026-08-28): vLLM defaults this to TRUE, so omitting the flag
#       does NOT disable it — the running engine reports enable_prefix_caching=True. To
#       actually turn it off the flag is --no-enable-prefix-caching.
#
#       ⚠ THE 2026-08-30 "ZERO HITS" FINDING WAS A PROMPT-LENGTH ARTIFACT. RETRACTED
#       2026-08-31. That measurement used a 1342-token prompt and swept only the remainder
#       (prompt_tokens % 16). It never crossed the reuse threshold, so it could only ever
#       report zero. MTP and prefix caching are NOT mutually exclusive on this stack.
#
#       WHAT ACTUALLY HAPPENS (measured 2026-08-31 on this exact recipe, spark-01, MTP
#       active at nst=5, image 2026081501). Hits follow an exact law with a hash unit of
#       U = 816 tokens, losing exactly ONE unit to the MTP/EAGLE last-block drop:
#
#           hits(L) = max(0, floor((L-1)/U) - 1) * U        U = 816
#
#       Every measured point fits it exactly:
#           L =    166 /   322 /   622 / 1222  ->      0 hits   (below the cliff)
#           L =   2422                          ->    816 hits  (33.7%)
#           L =   4822                          ->   3264 hits  (67.7%)
#           L =  19222                          ->  17952 hits  (93.4%)
#           L =  48022                          ->  46512 hits  (96.8%)
#
#       So the zero-reuse threshold is 2*U = 1632 tokens. Below it you get nothing; above
#       it the unreused remainder is bounded between U and 2*U REGARDLESS of context length.
#       Measured TTFT, cold vs cached:  19K prompt 15.56 s -> 2.10 s ;  48K 33.01 s -> 2.62 s.
#
#       The 816-token unit is the inflated attention block that covers the GDN mamba page —
#       the same mechanism as vllm#53749. It is not tunable from this recipe.
#
#       CONSEQUENCE — THE OLD BREAK-EVEN ARITHMETIC WAS WRONG AND IS WITHDRAWN. It assumed
#       a full re-prefill every turn:
#           OLD (wrong):  MTP on = P/980 + G/10.75      "full prefill every turn, no reuse"
#       With caching working, the prefill term is bounded by 2*U/980 ~= 1.7 s at any context
#       length, so:
#           MTP on   =  ~1.7 s + G/10.75
#           MTP off  =  ~0     + G/4.61
#       MTP now wins at every context length, including the case the old comment carved out
#       as its exception: 100K in / 200 out is ~20 s with MTP against ~43 s without, not
#       "121 s vs 43 s". There is no prefix-heavy/reply-light regime where dropping MTP wins.
#
#       STILL TRUE, AND STILL WORTH WATCHING: the NVFP4 sibling deployment
#       (qwen3.8-27b-nvfp4-rtx, vLLM v0.28.0, aihost01) shows 0 hits over 49M queried
#       tokens with MTP active. Same model family, different image and quantization, and
#       NOT explained by the law above. See vllm#54360 (spec decode zeroes hybrid-GDN hits
#       on nightly, regression from v0.24.0) and vllm#53670 (the last-block drop costs a
#       whole block per hit). The open fixes are #50897 (a committer's, "more proper", no
#       review) and #53802 (3 files; measured on 2x DGX Spark + Qwen3.8-27B: ~0% -> 98%).
#       Neither is merged as of 2026-08-31.
#
#       If your workload is genuinely prefix-heavy and reply-light, drop --speculative-config
#       (nst=0 is REJECTED at config validation — the flag has to go entirely, which means a
#       recipe edit, not a config override).
#
#   --attention-backend flashinfer
#       @official sets it and the GB10 SGLang run used FlashInfer, but vllm#51987 ("Revert
#       FlashInfer XQA decode support on SM12x") is open. Leaving it unset lets vLLM pick.
#       Worth an A/B once a baseline number exists.
#
#   --language-model-only / --skip-mm-profiling / --limit-mm-per-prompt '{"image":0}'
#       DO NOT ADD THESE. They disable the vision tower — get_limit_per_prompt() returns 0 for
#       EVERY modality when language_model_only is set. Vision is a primary use case for this
#       deployment (visual inspection of 3D render images), so the ViT must stay live and mm
#       profiling must run so its memory is actually reserved. Noted here because these flags
#       look like free wins for a text benchmark and would silently break image input.
#
#   --load-format instanttensor
#       An eugr-image-specific fast loader used by @official. Not an upstream vLLM flag;
#       not confirmed present in this pinned tag.
#
# VISION TUNING — the knobs that matter for inspecting 3D renders. All verified present in
# this pinned image via `vllm serve --help=all`. Still at defaults, and after measuring
# against the live endpoint (2026-08-31) that is the right place for them: the one flag this
# block used to say was MANDATORY for multi-view turns out not to be needed at all.
#
#   --limit-mm-per-prompt
#       ⚠ CORRECTED 2026-08-31 — the previous note here was WRONG. It claimed "DEFAULT IS 1
#       IMAGE PER REQUEST... or those requests are rejected". Not on this build. MEASURED
#       against the live endpoint: a 2-image request succeeded (prompt_tokens 1173) and a
#       4-image request succeeded (prompt_tokens 2337, and the model correctly answered "4"
#       when asked how many images it received). The engine never logs an mm limit at all.
#       So MULTI-VIEW NEEDS NO FLAG — do not add one on the strength of a comment.
#
#       And the images are genuinely USED, not merely tokenized: in a forced-choice between
#       one clean and one cracked part, the model picked the defective image correctly in
#       BOTH orders (clean,crack -> "Image 2"; crack,clean -> "Image 1"), so it discriminates
#       on content rather than position.
#
#       COST, measured marginally rather than from a single total: a second 768x768 image
#       adds 579 tokens (1173-594), and the 4-image case works out at 581 each. Call it
#       ~580 tokens per 768px view. Four camera angles is ~2.4K tokens against a 262K
#       window — multi-view is effectively free, so budget is not the constraint here.
#
#   --mm-processor-kwargs
#       Qwen-VL dynamic resolution: min_pixels / max_pixels. This is the real quality lever
#       for defect inspection — too low and fine surface artifacts are resampled away before
#       the model ever sees them; too high and a single render eats the token budget. Tune
#       against actual renders, not a benchmark.
#
#       MEASURED token cost vs square resolution (same image, one per request, prompt_tokens
#       including ~15 tokens of prompt/template overhead):
#           256px ->    82     512px ->   274     768px ->   594
#          1024px ->  1042    1536px ->  2322
#       Cost tracks PIXEL AREA, near-linearly (768->1536 is 4x the pixels and 3.9x the
#       tokens). So max_pixels is a direct token dial: doubling the edge quadruples the bill.
#       Nothing here is expensive at a 262K window — pick resolution on whether the defect
#       survives resampling, not on token budget.
#
#   --mm-processor-cache-gb
#       Caches processed images; worth setting if the same render is queried repeatedly.
#
#   --mm-encoder-attn-dtype fp8
#       Quantizes the vision encoder's attention. Do NOT use while vision quality is the
#       thing being evaluated.
#
# NOTE for a future FP8 variant: Qwen's FP8 checkpoint leaves the vision tower UNQUANTIZED
# (246 `model.visual.*` tensors in modules_to_not_convert) — only the language model is
# quantized. FP8 therefore costs nothing on the encoder, making it a reasonable SERVING
# choice for vision work even though this BF16 recipe is the one for unconfounded measurement.
#
#   --trust-remote-code
#       Needed by the Qwen3.6 recipe, NOT by this one — the processor is native in-tree.
#
# env:
#   VLLM_USE_DEEP_GEMM: "0"
#   VLLM_MOE_USE_DEEP_GEMM: "0"
#       Not needed for BF16. Keep in your pocket for the FP8 variant: vllm#51884 reports
#       blockwise-FP8 weights failing in process_weights_after_loading on capability
#       family 12 ("Unknown SF transformation"), with exactly these two vars as the fix.
# ---------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------
# MEASURED ON HARDWARE — dgx-spark-01, first boot 2026-08-28; MTP sweep 2026-08-29;
#                         GPQA-Diamond 2026-08-30
#
#   ★ GPQA-Diamond.         76.77% (+/- 3.01), 152/198, flexible-extract / exact_match.
#                           THE NUMBER THIS RECIPE EXISTS FOR: the unquantized reference
#                           measured against the NVFP4 quant with no precision confound.
#                             BF16  (this recipe, spark-01, nc=8)   76.77% +/- 3.01, 2 nulls
#                             NVFP4 (qwen3.8-27b-nvfp4-rtx, nc=1)   76.77% +/- 3.01, 2 nulls
#                           NVFP4 costs NOTHING MEASURABLE here — far inside the ~6-point
#                           difference this harness can resolve at n=198.
#                           Do NOT read "identical" as "same answers". strict-match differs
#                           (0.0202 vs 0.0354), so the generations are NOT the same, only the
#                           extracted-answer counts. Two independent runs tying exactly has
#                           ~7% odds anyway at n=198, p~0.77 (count sd ~5.9 items). The claim
#                           is NO DETECTABLE DIFFERENCE, not identical behaviour.
#
#                           Conditions — lm-eval 0.4.12, preset acc-gpqa-diamond-full-longgen,
#                           max_gen_toks 32768, seed 42, greedy (do_sample=False, temp 0.0),
#                           and reasoning_effort=medium ON BOTH SIDES. That last one is what
#                           makes the pair valid and is why this recipe pins it (60e662d).
#                           Asymmetries recorded rather than hidden: num_concurrent 8 vs 1,
#                           timeout 10800 vs 1800, MTP nst 5 vs 3. None should touch accuracy,
#                           but vLLM has no batch invariance, so nc=8 is a nondeterminism
#                           source. Wall time 3h45m (BF16) against 1h41m (NVFP4).
#
#   ⚠ Comparison hygiene.   Both earlier xhigh GPQA numbers are SUPERSEDED; do not quote them
#                           beside these. At xhigh the model reasons past even a 32768-token
#                           cap and returns EMPTY content, which lm-eval scores WRONG in
#                           silence — null rates 33% at 4096, 16.7% (RTX) and 13.5% (here) at
#                           32768. medium drops that to 2/198 on BOTH sides, so these are real
#                           scores rather than floors, and it ran 5x faster (52 s/item against
#                           352 s/item).
#                           The old "adjusted for nulls, ~84.8%" extrapolation was TOO
#                           GENEROUS: the clean number is 76.77%. Assuming empty items would
#                           score like answered ones was always optimistic — the items whose
#                           reasoning overruns are the harder ones.
#                           GLM-5.2's 69.2% is NOT comparable: standard 4096 preset at xhigh,
#                           so it carries the null artefact, in GLM's disfavour.
#                           Official Qwen3.8-27B is 89.2. That 12.4-point gap is harness and
#                           sampling — lm-eval CoT zeroshot, greedy, flexible-extract against
#                           Qwen's in-house harness at temp 1.0/top_p 0.95 — NOT quantization
#                           and NOT this fleet.
#                           strict-match reads ~0.02-0.04 for both. That is the strict
#                           answer-format filter failing on CoT prose, not a 2-4% score.
#                           flexible-extract is the metric.
#
#   ★ WHY they tied.        Measured directly 2026-08-31, and it explains the GPQA result far
#                           better than the score alone does. TEACHER-FORCED greedy agreement:
#                           feed BOTH endpoints the identical text via /v1/completions with
#                           echo + logprobs, and compare each model's argmax at every position.
#                           No free-running generation, so nothing compounds.
#
#                             CONTROL, BF16 vs ITSELF   291/291 = 100.00%, |dlogprob| 0.0000
#                             BF16 vs NVFP4             282/291 =  96.91%
#                             ...confident positions    188/188 = 100.00%  (BF16 p>0.5)
#                             ...structured code        112/112 = 100.00%
#                             median |dlogprob| on the same token: 0.018 nats (p95 0.41)
#
#                           The control matters: teacher-forced prefill is bit-deterministic
#                           here, so the metric's floor is exactly 100% and the whole 3.09%
#                           gap is QUANTIZATION, with no nondeterminism to subtract.
#
#                           NVFP4 only perturbs decisions the model does not care about. Zero
#                           disagreements at confident positions; every one was a near-tie
#                           between equivalent choices (',' vs ' and', ',' vs ' rather',
#                           ' \(' vs ' $'). That is why the two GPQA scores are identical —
#                           an answer that hinges on a confident prediction cannot move.
#
#   ⚠ Before spending a     THIS TEST COSTS 10 MINUTES and 8 requests. Run it BEFORE any
#     night on SWE-bench.   expensive quant comparison. At 3.09% per-token divergence the
#                           expected distance to first divergence is ~32 tokens, so any long
#                           agentic trajectory WILL diverge — but it diverges the way two coin
#                           flips diverge, not the way a worse model does, and those near-tie
#                           flips are the same class that already makes 20% of SWE-bench
#                           instances flip between IDENTICAL runs. With ~6-point resolution at
#                           n=500 against an effect this small, SWE-bench would measure its
#                           own noise. Run it for the standalone BF16 number and the agentic
#                           axis if you want them — but do NOT read the gap as a quality
#                           difference, and do not run it AS a quantization test.
#
#   Loads and serves.       vramActual 103,778 MiB; graph capture 5 s / 0.13 GiB.
#   Context.                KV cache 716,119 tokens at max_model_len 262144
#                           (2.73x concurrency). The full native window is affordable —
#                           only 16 of 64 layers hold a KV cache.
#   MTP works, no drafter.  SpeculativeConfig(method='mtp', num_spec_tokens=5);
#                           "Detected MTP model. Sharing target model embedding weights".
#                           Over 8 diverse prompts: nst=5 accepts 47.4% of drafted tokens
#                           => 3.369 tokens per forward pass; nst=3 accepts 64.1% => 2.924.
#   Decode.                 11.38 tok/s at nst=5 against 10.99 at nst=3, paired over the
#                           same 8 prompts (500-token greedy decode, thinking disabled,
#                           decode timed separately from prefill). That +3.5% is NOT
#                           significant (95% CI -0.27..+1.04 tok/s).
#                           QUOTE A RANGE, NOT A FIGURE: content variance dominates this
#                           model, sd ~12-17% across prompts — 7.6 tok/s on creative fiction
#                           up to 14.2 on a bash script. The first boot's "~9-12 tok/s" is
#                           consistent with that spread.
#   With reasoning on.      10.75 tok/s (sd 16.1%) at reasoning_effort=low, measured as
#                           tokens/WALL over the same 8 prompts — the number to compare
#                           against other reasoning models.
#   ⚠ Silent thinking.      The qwen3 parser emits NOTHING during the reasoning phase: zero
#                           reasoning_content deltas, then content starts. First delta landed
#                           14.8-39.4 s in, even at LOW effort — 20-40% of wall time with
#                           nothing on the wire. Two consequences. (1) UX: expect tens of
#                           seconds of dead air before any output. (2) MEASUREMENT: any
#                           "tokens / (wall - time-to-first-token)" formula treats that
#                           silence as prefill and inflates the rate — it read 14.66 tok/s
#                           against a true 10.75, a 23% overstatement. Use tokens/wall.
#   Glimmer is NOT faster.  This file used to record Muse Glimmer at 17.6 tok/s against our
#                           ~11 and call the gap "not yet explained". THE GAP IS AN
#                           ARTEFACT — it does not reproduce. Re-measured 2026-08-30 with
#                           the paired 8-prompt sweep, tokens/wall, one Spark each, both
#                           models at minimum reasoning (Qwen reasoning_effort=low, Glimmer
#                           reasoning_strength=low — Glimmer's template has NO
#                           enable_thinking, it ALWAYS reasons, so that is the matched knob):
#                               Qwen3.8-27B    median 10.72 tok/s   mean 10.75
#                               Muse Glimmer   median 10.36 tok/s   mean 14.56
#                           Median ratio 1.11x to Glimmer; the paired delta is NOT
#                           significant (t(7)=1.33, 95% CI -2.97..+10.58 tok/s), and Glimmer
#                           LOSES on 2 of 8 prompts. Its mean is inflated by ONE outlier, a
#                           red-black-tree coding prompt at 35.74 tok/s (2.91x Qwen).
#                           Glimmer's real character is BIMODAL — 8.8 to 35.7 tok/s, huge on
#                           predictable code, level with Qwen on prose. Do not carry "17.6"
#                           anywhere; it was one lucky prompt under the bad method above.
#   Drafter mechanism.      Real, but worth ~10%, not the ~60% the old number implied.
#                           Per forward pass Qwen yields MORE than Glimmer: 3.241 tokens at
#                           44.8% MTP acceptance vs 3.134 at 14.2% of DFlash's 15-token
#                           block. Glimmer's only edge is that DFlash pays ONE block pass
#                           where MTP pays 5 sequential ones. Against Glimmer's larger
#                           weights (59.6 vs 55.5 GB) the roofline puts that at ~1.12x; the
#                           measured median is 1.11x. Both are bandwidth-bound at 273 GB/s.
#   Vision.                 ⚠ "Works and is accurate" WAS OVERSTATED, and the evidence for it
#                           could not have shown otherwise: one image, containing a crack,
#                           described correctly. A model that always reports a crack scores
#                           100% on that test. Re-measured 2026-08-31 WITH NEGATIVE CONTROLS
#                           — 4 synthetic bracket parts x 4 camera views, half defect-free,
#                           on a prompt that does NOT presuppose a defect:
#
#                             single image @768px   cracks 4/4 | pits 1/4 | clean 4 ok,
#                                                   3 FALSE POSITIVES, 1 empty reply
#                             single image @1536px  pits 4/4   | clean 1 ok, 3 false positives
#                             all 4 views, 1 request, @768px   3/4 — and BOTH clean parts
#                                                   correctly passed
#
#                           TWO DIFFERENT FAILURES WITH TWO DIFFERENT CURES:
#                           (1) MISSES are a resolution problem. 3-7px pits went 1/4 -> 4/4
#                               by rendering at 1536 instead of 768. This is exactly what the
#                               --mm-processor-kwargs note below predicts: fine surface
#                               artifacts are resampled away before the model ever sees them.
#                               Resolution is the sensitivity dial, and it works.
#                           (2) FALSE POSITIVES are NOT. 3/4 at 768px, still 3/4 at 1536px —
#                               resolution changes nothing, because the thing being misread
#                               is plainly visible at both. The model calls the part's
#                               MACHINING STEP LINE "a thin horizontal scratch". That is a
#                               semantic error, not a perceptual one. In production it is a
#                               reproducible FALSE REJECT ON EVERY PART, which is worse than
#                               a miss — and single-defect-image testing cannot detect it.
#
#                           WHAT TO ACTUALLY DO: render at >=1536 (or raise max_pixels),
#                           send all 4 views in ONE request (it suppressed both false
#                           positives), and NAME THE PART'S LEGITIMATE FEATURES IN THE PROMPT
#                           so the step line is not read as damage. The first two are
#                           measured; the third follows from the failure mode and is untested.
#
#                           Cost: 594 prompt_tokens for one 768px image, 2364 at 1536px.
#                           Four 1536px views is ~9.5K tokens — nothing against a 262K window.
#
#                           CAVEATS: synthetic renders, not real 3D output, and n is small
#                           (16 single-view + 4 multi-view prompts). Treat the direction as
#                           solid and the exact rates as indicative. Re-run against real
#                           renders before trusting this for production inspection.
#                           Harness note: an empty reply must NOT be scored as a defect
#                           claim — the first version of this test did exactly that, the
#                           same null-scoring bug that corrupts GPQA at a low token cap.
#
# ⚠ REASONING EFFORT — READ BEFORE BENCHMARKING
#
#   The default reasoning effort (xhigh) can think past ANY token cap, and when it does the
#   API returns a COMPLETELY EMPTY response: finish_reason="length", completion_tokens at
#   the cap, and BOTH content AND reasoning_content empty. Not truncated — empty.
#
#   Measured on the prompt "Write a clear 250-word explanation ...":
#       default (xhigh)              >4000 tokens, finish=length -> EMPTY
#       chat_template_kwargs
#         reasoning_effort: low        564 tokens, finish=stop   -> full answer
#         enable_thinking: false       356 tokens, finish=stop   -> full answer
#
#   Consequence for evals: the acc-gpqa-diamond-full preset uses maxGenToks 4096 with
#   reasoning=true. Any item whose reasoning overruns returns empty and scores WRONG with
#   no error anywhere — indistinguishable from the model being bad. Raise the cap well
#   above 4096, or pin reasoning_effort, before trusting any accuracy number from this model.
#
#   ✅ THIS RECIPE NOW PINS reasoning_effort=medium (measured 2026-08-30 on the
#   NVFP4 sibling, qwen3.8-27b-nvfp4-rtx.yaml).
#
#   The template default is xhigh — the MAXIMUM — and nobody chose it. On agentic
#   work it is actively harmful: reasoning accumulates in a conversation resent
#   every turn, exhausting the context window. On SWE-bench Verified (same seeded
#   50 instances, only this flag changed) it took context-exceeded 4 -> 0, empty
#   patches 7 -> 1, and median messages 102 -> 52, with resolved rate unchanged
#   within noise (a same-config replicate varied by 8 points, twice the apparent
#   config effect).
#
#   PINNED HERE FOR COMPARABILITY, NOT JUST SPEED. The NVFP4 recipe sets it, and
#   an A/B of the two quantizations is only meaningful if reasoning effort is held
#   equal. If you unset it here, this recipe silently reverts to xhigh and any
#   comparison against the NVFP4 numbers becomes meaningless.
