# @dgxrun/radixark-qwen3.8-flash-next-nvfp4-c4-128k-mtp-2x — Qwen3.8-Flash-Next at TP2
# on TWO Sparks. LONG-CONTEXT / LOW-CONCURRENCY variant, for coding agents.
#
# THE SCENARIO. A local coding agent: 2-4 streams at most, but a large window, because
# the context holds a repository rather than a conversation. Optimised for single- and
# dual-stream tokens/sec and for the biggest window that is free.
#
# THE SIBLING is @dgxrun/radixark-qwen3.8-flash-next-nvfp4-c16-32k-mtp-2x, the chat3d shape:
# many short requests, aggregate throughput over per-stream latency. Same container,
# model, TP topology and correctness flags — only the serving knobs differ. Only one can
# hold the two-node pool at a time, and they publish the SAME served_model_name, so
# deploy one in place of the other rather than both (see the note on that below).
#
# WHY THE SPLIT EXISTS, measured rather than assumed (#91 gate 4): the cost of context is
# a CLIFF. Raising max_model_len taxes EVERY request, including short ones that never
# touch the window, because the per-step overhead is sized to the configured maximum:
#     32768    decode 36.42 / 57.42 / 79.38 tok/s at concurrency 1/2/4
#    131072    decode 38.21 / 53.10 / 84.35   -> noise, the window is FREE
#    262144    decode 30.98 / 47.91 / 57.95   -> -15% to -27%, and only ~4 GiB left free
# So 128K costs nothing and 256K costs a quarter of the throughput. That is why this is
# a separate recipe from the concurrent one rather than a flag on it.
#
# ALL GATES PASSED (#91). Boots at TP2, GSM8K 0.9674 flexible-extract over 1319 items,
# CUDA graphs + MTP, needle retrieval verified at 127,584 tokens and at depths
# 0.05/0.50/0.95 at 223,824, and vision verified (colour identity, spatial quadrant, and
# all 8 images accepted). This is a tuned serving recipe, not a bring-up shape.
#
# WHAT THIS MODEL IS. `Qwen4ExpForConditionalGeneration` / `model_type: qwen4_exp` —
# Qwen's preview of the Qwen4 architecture, and NOT a scaled-up Qwen3.8-27B (that is
# `Qwen3_5ForConditionalGeneration`). Nothing from the 27B recipes transfers by default.
# Multimodal: the config carries a `vision_config`, `image_token_id` and `video_token_id`.
# Also note `Qwen/Qwen3.8-Flash` does not exist as open weights — that is the Cloud API
# product; the open checkpoint is `Qwen3.8-Flash-Next`.
#
# WHY TP2 AND NOT TP1/TP4. 180 B params, and 38 % of the checkpoint (47.7 of 125.9 GiB,
# measured) is a 51.2 B n-gram
# (PLE) embedding table. That table is a `VocabParallelEmbedding` — SHARDED by TP, not
# replicated — so tensor parallelism is what makes it fit at all:
#
#     1 Spark  NVFP4   125.9 GiB/rank   IMPOSSIBLE — see below
#     2 Sparks NVFP4    63.0 GiB/rank   <-- this recipe; +12.6 non-torch = 75.5 consumed, MEASURED
#     2 Sparks FP8      86.4 GiB/rank   also fits; NVFP4 is staged and leaves more KV room
#     4 Sparks BF16     83.8 GiB/rank   costs the whole cluster
#
# TP1 IS NOT A TRADE-OFF, IT IS ARITHMETICALLY IMPOSSIBLE. An earlier version of this
# table said "1 Spark 101.7 GiB/rank, nothing left for KV; PLE offload needs unmerged
# vllm#53899", which was an inherited third-party figure and is WRONG in two ways.
#   1. 101.7 is BELOW the checkpoint itself. Measured from the safetensors index, total
#      weights are 125.9 GiB (63.3 MoE expert shards + 47.7 PLE FP8 + 14.9 bf16 body).
#      At TP1 nothing is sharded, so all 125.9 must be resident — that is 4.3 GiB over
#      the 121.63 GiB device TOTAL and 19.7 GiB over the ~106.2 GiB actually free after
#      the CUDA context. It fails at load, not at some context length.
#   2. PLE OFFLOAD TO HOST MEMORY CANNOT RESCUE IT. Offloading the 47.7 GiB table to
#      "host memory" buys real capacity on a discrete GPU. On GB10 it cannot, and this is
#      measurable rather than theoretical: /proc/meminfo MemTotal is 121.63 GiB and the
#      CUDA device total vLLM reports is ALSO 121.63 GiB. They are the same bytes. There
#      is no host pool sitting outside the device budget to move the table into.
#      CAVEAT, so this is not overstated: the research doc cites a third-party 1-Spark
#      result at 36.5 tok/s using vllm#53899. If host and device are one pool, that can
#      only be paging the table to STORAGE, not to host DRAM — a real route, but a
#      different trade (NVMe-speed sparse lookups) and one we have closed anyway, since
#      swap is disabled fleet-wide. Treat single-Spark as "needs an unmerged PR AND swap
#      re-enabled AND a large speed penalty", not as a configuration we can reach.
# The TP2 arithmetic closes against reality: 125.9/2 = 63.0 weights + ~12.6 non-torch
# (CUDA context, NCCL buffers) = 75.6, and vLLM's boot line reports 75.53 GiB consumed.
#
# Pipeline parallel is HARD-REFUSED in code (`NotImplementedError`, models/config.py:879)
# and TP must be a power of two, so TP2 and TP4 are the only options that exist.
#
# DO NOT REACH FOR Int4. Every AWQ/GPTQ build on HF is 167-175 GiB — LARGER than official
# FP8 — because they leave the PLE table in BF16. NVFP4 is the only quantization axis that
# helps here. This inverts the instinct the 27B work gives you.
#
# THE CHECKPOINT. RadixArk's modelopt NVFP4 build, 126 GiB, already staged on /mnt/tank.
# `hf_quant_config.json` excludes `*.ple.*` and `mtp.*` from quantization — the PLE table
# is FP8, not NVFP4 (the publisher's own model string is "qwen38next-nvfp4-plefp8"). The
# publisher also ships eval metrics for THIS checkpoint, which is the Gate-2 target:
#   gsm8k_metrics.json  -> 0.9727 over 1319 examples (temp 0.6, top_p 0.95, seed 0, 8192 max_tokens)
#   aime26_metrics.json -> pass@1 0.9875, majority@8 1.0
# Both measured on SGLang, so treat them as a cross-engine reference, not a like-for-like
# vLLM baseline. A large shortfall means something here is wrong; an exact match is luck.
#
# CONTAINER. `:2026091302` (vLLM 0.29.1rc1). NOT interchangeable with the `:2026081501`
# used by the 27B recipes — that image reports `Qwen4Exp supported: False` (verified on
# spark-01: it carries only the Qwen3_5 family). dgxrun never pulls, so the image must be
# present on BOTH nodes before deploying, or launch fails fast with "image not found
# locally".
# The earlier `:2026090501` (vLLM 0.28) also works but needs the now-retired
# `qwen4exp-ple-fp8-gate` mod to load the PLE table; 0.29 handles it natively. Do not
# mix: the mod hard-fails on 0.29 because its patcher asserts 0.28 source text.
# KNOWN BREAKAGE IN 0.29, harmless here: the b12x `instanttensor` loader plugin fails to
# import (`file_source_tensor`). vLLM logs it and continues. It matters only for recipes
# that pass --load-format instanttensor, which this one does not.
#
# NOT SET HERE, ON PURPOSE — dgxrun supplies them:
#   --distributed-executor-backend mp   (dgxrun injects it, and REWRITES it if present)
#   --nnodes / --node-rank / --master-addr / --master-port
#
recipe_version: "2"
runner: dgxrun
model: RadixArk/Qwen3.8-Flash-Next-NVFP4
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:2026091302
cluster_only: true
description: Qwen3.8-Flash-Next NVFP4 at TP2 — long-context coding-agent shape (128K window, 4 streams, MTP)

# THE PLE QUANT GATE. This checkpoint's body is NVFP4 but its PLE n-gram table is
# FP8 with one global BF16 scale — VERIFIED from the safetensors headers: 128
# `ngram_embedding.shard_N.weight` tensors are F8_E4M3 in a shard family literally
# named `model-plefp8-*`. vLLM's `_get_ple_embedding_quant_method()` only returns an
# FP8 method for ModelOptMixedPrecisionConfig or Fp8Config; an NVFP4 body yields
# ModelOptNvFp4Config, so the PLE is built UNQUANTIZED and the load dies with
#   ValueError: There is no module or parameter named 'ngram_embedding.weight_scale'
# (observed here 2026-09-14; upstream vllm#54765). The mod widens that gate.
# NO mods. The `qwen4exp-ple-fp8-gate` mod was REQUIRED on :2026090501 (vLLM 0.28)
# and must NOT be carried here. vLLM 0.29 restructured the PLE code into
# `nvidia/ngram_embedding.py` and added an explicit `ple_embedding_dtype` hook that
# short-circuits to the FP8 embedding method BEFORE any quant-config logic — and this
# checkpoint already declares `ple_embedding_dtype: "float8_e4m3fn"` in text_config.
# So 0.29 selects the right method natively. Re-adding the mod would HARD-FAIL every
# deploy: its patcher asserts 0.28 source text that no longer exists, so run.sh exits 1.
# NOTE upstream issue vllm#54765 is still OPEN and `ModelOptNvFp4Config` appears nowhere
# in the 0.29 code — the symptom was fixed by a different route. Do not judge this by
# the issue state.

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  # 0.80. NOTE this did NOT fix the gate-3 autotune OOM, and the comment here used
  # to claim it did — it was wrong and is corrected. MEASURED: dropping gmu 0.85 ->
  # 0.80 left free memory at compile time essentially UNCHANGED (44.63 -> 44.50 GiB),
  # because gmu governs the KV pool and the KV pool is not allocated until AFTER
  # compilation. On 0.28 the autotune OOM was fixed by --compilation-config (see the
  # note further down; on 0.29 it is gone and the flag is dropped), never by this.
  # Do not reach for gmu the next time a compile-time allocation fails.
  # LOWERED TO 0.70 BY GATE 4. The extra ~12 GiB is HOST headroom per rank, which is
  # what the long-context working set actually needs — see max_model_len below, where a
  # 224K prompt at gmu 0.80 was OOM-killed by the kernel with the KV pool still 3.4x
  # oversized. MEASURED to cost nothing: at max_model_len 32768, gmu 0.70 vs 0.80 gave
  # decode 36.42/57.42/79.38 vs 38.49/56.20/83.39 at concurrency 1/2/4 — mixed signs,
  # inside the +/-2-3% repeatability floor.
  # UNTESTED COMBINATION: gmu 0.80 at max_model_len 131072. It would roughly double the
  # KV pool and might suit a higher-concurrency variant, but it spends the headroom gate
  # 4 identified as the binding resource. Measure before shipping it.
  #
  # 0.85 was itself MEASURED: at 0.87 the first TP2 boot attempt died with
  #   ValueError: Free memory on device cuda:0 (105.72/121.63 GiB) on startup is less
  #   than desired GPU memory utilization (0.87, 105.82 GiB)
  # — short by 0.1 GiB. vLLM's startup guard compares gmu*TOTAL against CUDA-VISIBLE
  # free, which on GB10 sits ~7 GiB below MemFree because of CUDA contexts the host
  # does not account for (see memory `glm52-minfree-and-gmu-guard`). With ~116 GiB
  # MemFree the visible ceiling is ~105.7, so 0.87 fails structurally on these nodes,
  # not intermittently.
  # 0.85 -> 103.4 GiB, ~2.3 GiB of margin. Margin is worth more than KV on a boot
  # gate, and this is additionally a MULTIMODAL model whose vision-encoder warmup
  # allocates OUTSIDE the profiled budget — the GLM-5.3-Flash recipe records that
  # same shape SIGKILLing a worker at 0.89 with 0.24 GiB of slack.
  gpu_memory_utilization: 0.70
  # 131072 — GATE 4's answer, measured 2026-09-15. Read the whole note before changing it.
  #
  # THE DOCUMENTED 95-100K WEDGE DOES NOT OCCUR HERE. vllm#54629 (4x GB10) and a
  # dual-Spark report near 95K were the reason this opened at 32768. Needle probes
  # sailed through 95,934 and 127,584 at full prefill speed. That risk is retired.
  #
  # THE REAL LIMIT IS HOST MEMORY, NOT KV AND NOT vLLM. GB10 unified memory means host
  # pressure IS GPU pressure. Measured at gmu 0.80 / 262144: a 223,824-token prompt was
  # OOM-KILLED by the kernel (`VLLM::Worker_TP invoked oom-killer`, global_oom, NVRM
  # NV_ERR_NO_MEMORY) while the KV pool still had 1,376,622 tokens free. KV capacity was
  # never the constraint; the prefill working set outside the pool was.
  #
  # WHY NOT THE NATIVE 262144. It works — 255,684 tokens retrieved correctly at gmu 0.70
  # — but it is not free and not safe:
  #   - throughput falls 15-27% on EVERY request, including 4096-token ones that never
  #     touch the window (decode c1/c2/c4: 30.98/47.91/57.95 vs 36.42/57.42/79.38 at
  #     32768, same gmu). This is fixed per-step overhead sized to the configured max.
  #   - the long-context WORKING SET is ~18.5 GiB PER RANK and is never given back. It is
  #     a high-water mark, not a leak: a 224K prompt takes available memory from ~23/27 GiB
  #     down to ~4/8 GiB on the two ranks, 90 seconds of settling returns none of it, and a
  #     SECOND 224K prompt costs nothing further. At 262144 that leaves ~4 GiB of slack,
  #     which is the whole margin. (Both ranks behave IDENTICALLY here — an earlier note
  #     claimed rank 1 was structurally heavier and that was wrong, measured from a single
  #     reading taken seconds after a 256K prompt. The head does run ~4 GiB heavier, but
  #     only because the API server and EngineCore live there.)
  #   - THIS is the quantitative reason gmu 0.80 died: it left ~7 GiB of slack against an
  #     ~18.5 GiB demand. gmu 0.70 leaves ~23 GiB, so it fits. Note the working set is
  #     OUTSIDE the KV pool (KV is 7.52 GiB total and reads 0% used while the 18.5 GiB is
  #     held), so gmu does not help by sizing KV — it helps by leaving more of the device
  #     UNBUDGETED. vLLM says as much at boot: it offers `--kv-cache-memory=28.28 GiB` "to
  #     fully utilize gpu memory", which is precisely the setting that recreates the OOM.
  #   - prefill collapses at the top of the window: 2652 -> 808 tok/s between 224K and
  #     256K, a 3.3x slowdown for a 1.14x length increase. That is memory thrash, not
  #     attention cost.
  #
  # WHY 131072 IS THE RIGHT NUMBER. The cost is a CLIFF, not a slope. At 131072 the
  # throughput deltas vs 32768 are +4.9% / -7.5% / +6.3% — mixed signs, at the +/-2-3%
  # repeatability floor of the sweep harness. So 4x the context is essentially free, and
  # only the last doubling is expensive. Needle FOUND at 127,584 (and at depths 0.05,
  # 0.5, 0.95 at 223,824). Both ranks keep >20 GiB idle headroom. KV 7.45 GiB =
  # 479,232 tokens = 3.66x concurrency at full length.
  #
  # DCP DOES NOT APPLY, do not reach for it. That was the GLM-5.2 lever and this is not
  # an MLA model: Qwen4Exp is 36 linear-attention (GDN) layers + 12 full-attention, and
  # GDN state is recurrent per-sequence state with no KV to shard. num_key_value_heads=2
  # already makes KV nearly free — the pool was 3.4x oversized when the OOM hit. DCP
  # multiplies effective KV, which is the one resource we have a surplus of.
  max_model_len: 131072
  # 4, deliberately LOW — this recipe targets the coding-agent scenario (2-4 streams,
  # large context), not max aggregate throughput. The concurrency ladder was measured
  # on the way here and is recorded so it is not re-run: at 16, aggregate decode
  # saturated at ~180 tok/s and 32/64 added nothing but latency (TTFR 1.55s -> 7.2s
  # -> 18.5s) because requests queued rather than ran; at 32 the engine genuinely held
  # 32 sequences and still ran 240 requests with zero stalls.
  # A separate chat3d-shaped recipe with a high max_num_seqs is the right home for
  # that regime — do not raise this one to chase aggregate tok/s.
  # Still well under the official 256: GDN state is PER SEQUENCE (~108 MiB/seq at
  # TP1), so this is a memory knob as much as a throughput one — and the documented
  # GDN decode-kernel hang lives at concurrency ~32, which VLLM_GDN_DECODE_KERNEL=
  # triton is what protects against (verified: a 32/64 sweep completed 240 requests
  # with zero stalls).
  max_num_seqs: 4
  # 2048. As with gmu above, this did NOT fix the gate-3 autotune OOM and the comment
  # here used to claim it would. MEASURED: the inductor autotune asked for a FIXED
  # 47.69 GiB, BYTE-IDENTICAL at max_num_batched_tokens 4096 and 2048 — the workspace
  # is not driven by batched tokens. Hypothesis falsified; do not try 1024.
  # It stays at 2048 because it is what every measurement since gate 3 was taken at.
  max_num_batched_tokens: 2048
  # SHARED with the c16-32k sibling, following the house convention (all five GLM-5.2
  # variants publish `glm-5.2`). The gateway pools replicas by published name, so if both
  # variants were ever deployed at once a request could land on either and silently get a
  # 32768 window instead of 131072. Two Sparks and TP2 make that impossible today — only
  # one variant fits — but split the names before that stops being true.
  served_model_name: qwen3.8-flash-next

env:
  # sm_121a everywhere — the Sparks need the arch-specific build path.
  TORCH_CUDA_ARCH_LIST: "12.1a"
  CUTE_DSL_ARCH: "sm_121a"
  # The default CUDA GDN decode kernel DETERMINISTICALLY HANGS the engine at
  # concurrency ~32 with FP8 GDN projections. No error — requests just stall.
  VLLM_GDN_DECODE_KERNEL: "triton"
  VLLM_USE_DEEP_GEMM: "0"
  # Keep JIT/autotune compile parallelism low; these boxes OOM before they run out of CPU.
  MAX_JOBS: "2"
  FLASHINFER_NVCC_THREADS: "1"
  # First boot on a new arch can spend a LONG time in autotune/JIT and look like a hang.
  # Do not shorten this because the log has gone quiet — that is the documented trap.
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"

# FLAGS THAT FAIL SILENTLY — the omissions below are load-bearing. Each one produces
# wrong behaviour with NO error, so "it started and answered" does not clear any of them.
#
#   MTP IS NOW ON — TRIAL, and it must be VERIFIED not trusted. vllm#55375 (MTP output
#     corruption) merged FOUR HOURS after this image was cut, so this image may carry the
#     bug. The checkpoint has ONE mtp layer (`mtp.num_hidden_layers: 1`, one layer index
#     in the weights), so num_speculative_tokens=1 is the matching value and the best
#     case is ~2 tokens per forward.
#     CORRUPTION SIGNATURE: accept-length pinned at its MAXIMUM is the bug, not health —
#     one reported case read 3.00/3 while scoring 0/10. At k=1 that means a constant
#     2.00/2. Check `vllm:spec_decode_*` metrics AND re-run GSM8K against our measured
#     0.9666 before trusting any speedup. Revert to no --speculative-config if either
#     signal is off.
#   PREFIX CACHING IS ON, and omitting the flag is NOT how you turn it off. This block
#     used to claim "NO --enable-prefix-caching. Off for first boot (vllm#54173)". That
#     was wrong: vLLM V1 defaults it to ON, so the absence of the flag leaves it enabled.
#     Verified on the engine — `enable_prefix_caching=True` in the V1 config line.
#     Disabling it needs an explicit --no-enable-prefix-caching.
#     No harm resulted: `--mamba-cache-mode align` is MANDATORY with prefix caching on,
#     and vLLM applies it automatically for this architecture ("Mamba cache mode is set
#     to 'align' for Qwen4ExpForConditionalGeneration by default when prefix caching is
#     enabled"). So every measurement on this recipe — GSM8K 0.9674 included — was taken
#     with prefix caching on and a correct cache mode.
#     Still true: 'all' prefix caching raises NotImplementedError in
#     models/qwen4_exp/nvidia/model.py:641.
#   NO --kv-cache-dtype. The QSA backend declares supported_kv_cache_dtypes =
#     ["auto", "bfloat16"] and enforces it at config time. NVFP4 KV fails silently —
#     three independent GB10 measurements.
#   NO --moe-backend. Leave it on auto (-> FLASHINFER_CUTLASS). `flashinfer_b12x` faults
#     on sm_121; `triton`/`cutlass` overflow the 99 KiB SMEM budget. The `triton` you see
#     in official recipes is a HOPPER requirement, not a portable default.
#   NO --enable-expert-parallel. Both documented multi-Spark wedges involved EP.
#
# --enforce-eager IS A GATE-1 MEASURE, NOT A SERVING CHOICE. Without it, boot died in
#   torch.compile autotuning:
#     InductorError: Failed to run autotuning code block: CUDA out of memory.
#     Tried to allocate 47.69 GiB. GPU 0 has 121.63 GiB total, of which 44.57 GiB is free.
#   Weights are resident by then (~75 GiB/rank), so inductor had ~45 GiB and asked for
#   47.69 GiB in one block. Eager skips capture and its autotune entirely.
#   REMOVE THIS FOR GATE 3 (throughput): CUDA graphs are the throughput fix on this
#   family — eager decode is host-bound — so a tok/s number measured with eager is a
#   floor, not the model's capability. The levers to try before re-enabling graphs are
#   max_num_batched_tokens (4096 -> 2048 -> 1024; the GLM-5.2 indexer prewarm had this
#   exact shape) and an explicit cudagraph_capture_sizes list.
#
# THERE IS NO --compilation-config HERE, AND THAT IS DELIBERATE. On vLLM 0.28 this
#   recipe carried
#     --compilation-config '{"inductor_compile_config":{"triton.autotune_at_compile_time":false}}'
#   because with CUDA graphs on, boot died in `generate_and_run_autotune_block`
#   (inductor wrapper codegen) asking for a FIXED 47.69 GiB. Two hypotheses were tested
#   and BOTH FALSIFIED, so do not retry them if it ever comes back:
#     - max_num_batched_tokens 4096 -> 2048: allocation byte-identical (47.69 GiB).
#       The workspace is NOT driven by batched tokens.
#     - gpu_memory_utilization 0.85 -> 0.80: free memory UNCHANGED (44.63 -> 44.50 GiB).
#       gmu governs the KV pool, which is not allocated until AFTER compilation, so it
#       cannot affect what is free during compile.
#   ~77 GiB of weights are resident at compile time leaving ~44.5 GiB against a fixed
#   47.69 GiB request, so it could never fit by starving it.
#
#   ON 0.29 THE OOM IS GONE. Removed and re-tested on hardware 2026-09-15: boot reaches
#   `Breakable CUDA graph enabled`, captures PIECEWISE 5 + FULL 3, init engine 47.02 s,
#   KV 19.96 GiB / 898,228 tokens. No 47.69 GiB allocation anywhere in the log.
#
#   AND IT WAS NEVER COSTING THROUGHPUT. The suspicion that deferring kernel selection
#   depressed single-stream decode — and explained part of the gap to SGLang's published
#   64 tok/s — is FALSIFIED. Paired sweeps, coding-shaped pp4096/tg1024, MTP on:
#            conc 1        conc 2        conc 4
#     with    38.67        54.42         74.46
#     w/o     38.49/37.69  56.20/56.95   83.39/80.74
#   Single-stream moved less than the +/-2-3% run-to-run spread measured by repeating
#   the sweep on one deployment. Prefill is unchanged (a 5% dip in the first run did not
#   reproduce in the second — it was noise, not a cost). Concurrency 4 gains ~10%, which
#   is ~3x the spread and looks real, but rests on a single control sample.
#   So: dropped because it is no longer NEEDED, not because it was expensive. Look
#   elsewhere for the SGLang gap.
#   NOTE this was a DIFFERENT autotune from --no-enable-flashinfer-autotune above, which
#   is still disabled.
#
# --reasoning-parser qwen3 is REQUIRED: without it the reasoning trace and a stray
#   </think> leak into `content`.
# reasoning_effort MUST be pinned to medium: the chat template defaults to `xhigh`, which
#   reasons past generous caps and returns EMPTY content — the same trap the 27B recipes hit.
command: |
  vllm serve {model} \
      --served-model-name {served_model_name} \
      --host {host} \
      --port {port} \
      --tensor-parallel-size {tensor_parallel} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-chunked-prefill \
      --no-enable-flashinfer-autotune \
      --enable-auto-tool-choice \
      --tool-call-parser qwen3_xml \
      --reasoning-parser qwen3 \
      --default-chat-template-kwargs '{"reasoning_effort":"medium"}' \
      --limit-mm-per-prompt '{"image":8}' \
      --speculative-config '{"method":"mtp","num_speculative_tokens":1}'
