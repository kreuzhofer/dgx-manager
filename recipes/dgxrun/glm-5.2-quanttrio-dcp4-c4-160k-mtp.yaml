# @dgxrun/glm-5.2-quanttrio-dcp4-c4-160k-mtp — 4 concurrent agents, 160K context each. DCP4 + MTP.
#
# Sibling of @dgxrun/glm-5.2-quanttrio-dcp4-c2-230k, which spends the same pool on two
# streams of 230K instead of four of 160K. Pick this one when you actually run 3-4 agents.
#
# Rests on a measurement taken 2026-08-07: DCP4 yields **78,446 KV tokens/GiB, exactly 2.00x
# DCP2's 39,223** from an identical pool (666,880 vs 333,440 tokens at 8.50 GiB). That
# overturned an earlier "DCP4 costs more peak memory" result whose three attempts all died on
# the mnbt-2048 sparse-indexer prewarm and never reached KV allocation.
#
# DCP4's real limit is the execution working set, not KV: at 320K with an 8.50 GiB pool it
# clears startup, KV alloc and graph capture, then kernel-OOMs on the FIRST forward pass.
# So the doubled efficiency is spent on concurrency rather than window:
#   KV 6.00 GiB -> 470,784 tokens measured -> 2.87x at 160K.
#
# Measured here (chat-short: pp=512 tg=128 runs=3):
#   decode  c=1  16.4 tok/s   |  c=4  30.6 tok/s aggregate (~7.6/agent)
#   prefill c=1 349.1 tok/s   |  c=4 345.8 tok/s
#
# MTP is load-bearing: without the speculative-config decode falls to 9.4 / 21.6. MTP costs
# ~10% prefill and worsens TTFR at c=4 (3.1s -> 4.6s), which is a good trade for agentic work.
# MTP + PIECEWISE + DCP4 had never been run together before this; it works.
#
# Known cost vs @dgxrun/glm-5.2-quanttrio-unpruned-dcp2-320k: single-stream decode is 16.4 vs
# 24.7 tok/s. That gap is DCP4's decode communication overhead and does NOT tune away with MTP.
# The trade is real concurrency and per-stream context; the 320K recipe runs max-num-seqs 1.
recipe_version: "2"
runner: dgxrun
maxoutmem: true
model: QuantTrio/GLM-5.2-Int4-Int8Mix
runtime: vllm
container: vllm-node-tf5-glm52-b12x-dcp:probe
cluster_only: true
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  # vLLM's startup guard requires free >= gmu*total. That check only clears once
  # vm.min_free_kbytes is small (node-prep now sets 1 GiB, not 5) — the kernel
  # withholds min_free from CUDA too. Confirmed serving at 0.90 on 2026-07-09.
  # 0.88, not 0.90. The guard needs free >= gmu*121.63. At 0.90 that is 109.46 GiB and a
  # measured startup free of 109.41 GiB FAILED by 0.05 GiB (2026-07-10) — 0.90 clears by
  # under 100 MiB, i.e. by luck. gmu does not cap allocation here (KV is pinned via
  # --kv-cache-memory-bytes), so lowering it is free margin.
  gpu_memory_utilization: 0.88
  # 256K is the CEILING for this config, measured 2026-07-09 by bisection:
  #   KV 7.00 GiB (262144) -> serves.
  #   KV 7.75 GiB (294912) -> kernel OOM-kill of VLLM::Worker_TP during capture.
  #   KV 8.50 GiB (327680) -> kernel OOM-kill during capture.
  # Steady-state free while serving 256K is only ~2.9 GiB on the worst node:
  # weights 93.9 + KV 7.0 + ~14 GiB of FULL cudagraphs / activations / CUDA
  # contexts, out of 121.63. To go beyond 256K you must give something up —
  # the separate MTP drafter (~4.8 GiB) or cudagraph FULL -> PIECEWISE — and
  # both cost decode speed. Do not raise max_model_len without also raising
  # --kv-cache-memory-bytes below; KV must hold >= max_model_len tokens
  # (7.00 GiB = 274,560 tokens, i.e. only 4.7% slack over 262,144).
  # ===================== WHY 320K, AND WHAT THE LIMIT REALLY IS =====================
  # Measured 2026-07-10. The limiter is NOT the KV cache and NOT the DCP degree. The b12x
  # sparse-indexer PREWARM (sparse_attn_indexer.py::_prewarm_b12x_paged_indexer_prefill ->
  # b12x/attention/indexer/paged.py::index_topk_fp8) allocates
  #     fold_values + fold_indices = (profile_q_rows * total_slices, topk) x 8 bytes
  # with profile_q_rows = max_num_batched_tokens and total_slices proportional to max_model_len.
  # So the transient workspace is proportional to  max_num_batched_tokens x max_model_len :
  #     mnbt 2048 @ 256K -> 5.00 GiB   (observed exactly)
  #     mnbt 2048 @ 512K -> 10.00 GiB  (observed exactly)
  # That single allocation OOM-killed 288K, 320K and every DCP4 attempt. Halving mnbt to 1024
  # halves it (3.12 GiB @ 320K), which more than pays for the +1.50 GiB of extra KV.
  # Cost: ~11% prefill on short prompts (619 vs 698 tok/s @ pp=8192); decode UNCHANGED (23.8).
  # Validated: a 300,036-token prompt (92% of the window) retrieved a buried needle, finish=stop,
  # 893 tok/s prefill. Steady free while serving: ~1.7-1.9 GiB (was ~2.9 GiB at 256K).
  # To go further, halve mnbt again (512 -> 1.56 GiB @ 320K) or raise KV; each step costs prefill.
  # =================================================================================
  max_model_len: 163840   # 160K x 4 concurrent = 640K tokens
  served_model_name: glm-5.2
env:
  HF_HOME: /cache/huggingface
  HF_HUB_OFFLINE: "1"
  LD_PRELOAD: /cache/huggingface/nccl-2.30.4/libnccl.so.2
  # All JIT caches under one subfolder on NFS (distinct from the pruned model's). Persisted -> warm relaunch.
  TRITON_CACHE_DIR: /root/glm-jit/triton
  TORCHINDUCTOR_CACHE_DIR: /root/glm-jit/inductor
  VLLM_CACHE_ROOT: /root/glm-jit/vllm
  FLASHINFER_JIT_DIR: /root/glm-jit/flashinfer-jit
  FLASHINFER_WORKSPACE_DIR: /root/glm-jit/flashinfer-ws
  FLASHINFER_AUTOTUNE_DIR: /root/glm-jit/flashinfer-autotune
  FLASHINFER_AUTOTUNER_LOAD_FROM_FILE: "1"
  TORCHINDUCTOR_COMPILE_THREADS: "1"   # serialize compile so its peak fits alongside the 97GB weights
  MAX_JOBS: "2"
  NVCC_THREADS: "1"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "5400"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"   # bound the sparse-indexer logits buffer (context-sized ~10GB) -> frees KV budget for 256K
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_DCP_GLOBAL_TOPK: "1"
  VLLM_DCP_SHARD_DRAFT: "1"
  TORCH_CUDA_ARCH_LIST: "12.1a"
  GLM52_BIND_HOST_TRITON: "0"
  NCCL_NET: IB
  NCCL_IB_DISABLE: "0"
  NCCL_IB_HCA: "rocep1s0f0,roceP2p1s0f0"
  NCCL_SOCKET_IFNAME: "enP7s7,enp1s0f0np0,enP2p1s0f0np0"
  GLOO_SOCKET_IFNAME: enp1s0f0np0
  NCCL_IB_GID_INDEX: "3"
  NCCL_CROSS_NIC: "1"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_DEBUG: WARN
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
command: |
  vllm serve {model} --served-model-name {served_model_name} --host {host} --port {port} --trust-remote-code --reasoning-parser glm45 --tool-call-parser glm47 --enable-auto-tool-choice --enable-prefix-caching --speculative-config '{"model":"CosmicRaisins/GLM-5.2-MTP-INT4-aligned","method":"mtp","draft_attention_backend":"B12X_MLA_SPARSE","num_speculative_tokens":3,"draft_sample_method":"probabilistic"}' -tp {tensor_parallel} --pipeline-parallel-size 1 --decode-context-parallel-size 4 --dcp-kv-cache-interleave-size 1 --attention-backend B12X_MLA_SPARSE --hf-overrides '{"index_topk_pattern":"FFFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSS"}' --max-model-len {max_model_len} --max-num-seqs 4 --max-num-batched-tokens 1024 --gpu-memory-utilization {gpu_memory_utilization} --kv-cache-dtype fp8_ds_mla --kv-cache-memory-bytes 6442450944 --async-scheduling --distributed-executor-backend mp --compilation-config '{"cudagraph_mode":"PIECEWISE","max_cudagraph_capture_size":8}'
