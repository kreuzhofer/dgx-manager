# @dgxrun/glm-5.3-flash-libertai-nvfp4-2x — GLM-5.3-Flash (NVFP4) on TWO Sparks.
#
# 320B total / 18B active, hybrid KDA + sparse-MLA, natively multimodal, 1M-token
# native window. At NVFP4 the weights are ~182 GB, i.e. ~85 GiB per rank at TP2 —
# so this leaves two Sparks free, unlike every GLM-5.2 recipe here which takes
# the whole pool.
#
# ============================ NOT A GLM-5.2 VARIANT ============================
# GLM-5.3-Flash is `glm5_next` (Glm5NextForConditionalGeneration): 45 layers,
# hidden 4096, 288 experts, 34 KDA linear-attention layers + 11 full sparse-MLA
# layers, and NoPE MLA (qk_rope_head_dim = 0). GLM-5.2/5.3 are `glm_moe_dsa`:
# 78 layers, hidden 6144, 256 experts, uniform DSA with a real RoPE dim.
#
# Nothing transfers. Not the container, not the CosmicRaisins sm12x kernels, not
# b12x, not the B12X_MLA_SPARSE backend, not the index_topk_pattern override, not
# DCP. The GLM-5.2 image does not contain the `glm5_next` model class at all —
# vLLM 0.28.0 *release* does not either. Do not "adapt" a GLM-5.2 recipe to this
# model; you will get a config that cannot load and a long afternoon.
#
# Container: built by scripts/build-glm53-flash-image.sh from vLLM's own day-0
# arm64 image plus the vendored sm_121 overlay (scripts/glm53-flash-overlay/).
# Unlike the GLM-5.2 image this involves no CUDA compile — it is a pull plus
# eight Python/pip layers.
# ===============================================================================
#
# Ported from barrydeen/glm53-flash-dgx-spark @ c267f9f (MIT), which validated
# this exact shape on 2x GB10. Deviations from that launcher, all deliberate:
#
#   1. Fabric env (NCCL_IB_HCA / *_SOCKET_IFNAME / GLOO_*) is injected by dgxrun,
#      not written here — upstream's values name a different fleet's NICs.
#   2. `--distributed-executor-backend mp` and the rank flags (--nnodes,
#      --node-rank, --master-addr, --master-port, --headless) come from dgxrun.
#   3. Weights resolve from the shared HF cache via `model:` rather than a
#      bind-mounted /models path.
#   4. Native MTP rather than upstream's DFlash2 — see "SPECULATIVE DECODING".
#
# NODES: build and deploy on exactly the two nodes the image was built on.
# There is no cluster-wide distribution step; a node without
# vllm-glm53-flash-sm121:probe refuses the deploy (dgxrun requires the image
# locally and fails fast).
recipe_version: "2"
runner: dgxrun
maxoutmem: true
model: LibertAIDAI/GLM-5.3-Flash-NVFP4
runtime: vllm
container: vllm-glm53-flash-sm121:probe
cluster_only: true
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  # 0.87, NOT upstream's 0.85 and NOT the 0.89 the startup guard would allow.
  # Raised, then deliberately backed off, while measuring issue #24.
  #
  # At 0.85 vLLM auto-computed only 4.41 GiB of KV (667,275 tokens) and said so
  # itself — "Replace gpu_memory_utilization config with --kv-cache-memory=
  # 10020882432 (9.33 GiB) to fully utilize gpu memory" — i.e. ~5 GiB of the
  # device sat unused.
  #
  # ================ WHY NOT 0.89, WHICH THE GUARD ALLOWS ================
  # 0.89 works right up until it doesn't. It boots, profiles, and allocates a
  # 9.76 GiB / 1,445,763-token pool — and is then SIGKILLed:
  #     ERROR multiproc_executor.py:310  Worker proc VllmWorker-0 died
  #           unexpectedly (exit code: None)
  #     INFO  base.py:235  Multi-modal warmup completed in 9.704s
  # `exit code: None` is a signal kill. The VISION-ENCODER WARMUP runs AFTER KV
  # is sized and allocates outside the profiled budget, so what actually matters
  # is the slack left over, free - gmu*total:
  #     gmu 0.85 -> 108.45 - 103.38 = 5.07 GiB -> warmup fits
  #     gmu 0.89 -> 108.49 - 108.25 = 0.24 GiB -> worker OOM-killed
  # Clearing vLLM's startup guard is necessary but NOT sufficient. This is the
  # GLM-5.2 memory-wall lesson again, from a new direction.
  #
  # ======================= WHY 0.87 SPECIFICALLY ========================
  # The most KV we can buy while still leaving the multimodal warmup room.
  # Measured at 0.87 rather than derived:
  #     KV pool                          = 1,015,403 tokens
  #     concurrency at 327,680/request   = 3.10x   (0.85 gave 2.55x at 262K)
  #     warmup slack 108.49 - 105.82     = 2.67 GiB  (0.24 died, 5.07 worked)
  #
  # NOTE the KV pool is three times what the 320K window below needs. That is
  # not waste and not an argument for lowering gmu: the surplus is CONCURRENCY.
  # The window is capped by a kernel limit, not by memory, so spare pool is the
  # only thing the extra memory can usefully buy.
  #
  # (Weights + non-torch measured 96.34 GiB at gmu 0.85 and 95.87 at 0.87; free
  # at startup 108.45 and 108.49 respectively. Both pairs are real readings from
  # different boots, not a transcription error — the figures wobble by ~0.5 GiB
  # run to run, which is itself a reason not to sit on a computed boundary.)
  #
  # Raising gmu is preferred over pinning --kv-cache-memory-bytes: pinning
  # re-introduces the GLM-5.2 failure where a hand-set pool allocates cleanly and
  # then fails under load.
  gpu_memory_utilization: 0.87
  # 327680 (320K) — 1.25x upstream's 262144, measured in issue #24.
  #
  # MEASURED AT THIS SETTING (gmu 0.87, 2026-08-29, spark-02 head + spark-03).
  # All figures here are WITHOUT speculative decoding; enabling MTP changes the
  # pool and the decode rate, and those numbers live with num_speculative_tokens.
  #     GPU KV cache size: 1,015,403 tokens
  #     Maximum concurrency for 327,680 tokens per request: 3.10x
  #     needle at 294,828 prompt tokens (90% of window, 50% depth): retrieved
  #       verbatim, finish_reason=stop
  #     cold prefill ~1,311 tok/s ; decode 14.3 tok/s (the window and gmu do not
  #       touch decode — 14.4 before this change)
  # Do NOT quote the ~21,000 tok/s a repeat of the same long prompt reports:
  # that is prefix cache, not prefill.
  #
  # ============ THE REAL CEILING IS A KERNEL LIMIT, NOT MEMORY ============
  # 480K was configured, booted, allocated a 927,955-token pool and served short
  # prompts perfectly. It then died on the FIRST long prefill:
  #     RuntimeError: launch_persistent_topk, topk.cu:138, persistent_topk would
  #     oversubscribe and the FilteredTopK fallback requires >=128KB smem per
  #     block (have 101376). total_ctas=59 > num_sms*occupancy=48
  #     (TopK=512, vec_size=4, ctas_per_group=59, smem=35968)
  # The sparse indexer's top-k launch caps at 48 CTAs on GB10, and its fallback
  # wants 128 KB of shared memory where GB10 offers ~99 KB — the same smem wall
  # overlay layer v8 works around for the KV tile.
  #
  # WHAT WE ACTUALLY KNOW, stated carefully because it is easy to over-read:
  #     max_model_len 491,520 + a ~367K-token prompt -> 59 CTAs -> FAILED
  #     max_model_len 327,680 + a  294,828-token prompt      -> SERVED
  # BOTH variables differ between those runs, so this does NOT establish which
  # one drives the CTA count. An earlier revision of this comment claimed the
  # driver is max_model_len and derived a "~400K ceiling" from it; that was a
  # confounded inference and has been removed. The only sound conclusions are
  # that 327,680 is validated and 491,520 is not.
  #
  # (For the same reason, do not trust the token counts in older notes: this
  # filler prose runs ~5.31 chars/token, not the ~4 first assumed, which is what
  # made the failing prompt look like 487K when it was ~367K.)
  #
  # To find the real ceiling, vary ONE of them at a time and probe each with a
  # long prefill. Upstream's 262144 was evidently not arbitrary either.
  #
  # THE LESSON, and why the recipe says this twice: a config here can boot,
  # profile, allocate, pass /health and answer short prompts while being unable
  # to serve the window it advertises. Only a long-prefill probe finds it — so
  # if you raise this value, raise it with evidence from
  # scripts/needle-probe.py, never with arithmetic.
  # ========================================================================
  #
  # Superseded reasoning, kept because it is still true and still bounds us:
  #
  # KV itself is astonishingly cheap here: ~148,131 tokens/GiB, because fp8 over
  # MLA's compressed latent costs roughly two orders of magnitude less per token
  # than an ordinary cache. On that arithmetic alone the full native 1,048,576
  # window looks like it fits in ~7 GiB, and 1M was tried on exactly that basis.
  #
  # It does not fit, and the reason is the GLM-5.2 lesson once more: PEAK
  # ACTIVATION GROWS WITH THE WINDOW, so the pool shrinks precisely as the
  # requirement rises. Measured at gmu 0.87:
  #     max_model_len 262144 -> peak activation 2.63 GiB -> KV 7.32 GiB
  #     max_model_len 1048576 -> peak activation 6.80 GiB -> KV 3.15 GiB
  # and vLLM refused to start:
  #     ValueError: To serve at least one request with the model's max seq len
  #     (1048576), 6.1 GiB KV cache is needed, which is larger than the available
  #     KV cache memory (3.15 GiB). Based on the available memory, the estimated
  #     maximum model length is 520704.
  #
  # 520,704 is vLLM's own activation-aware ceiling — a MEMORY bound, and not the
  # binding one: 491,520 sits under it and still failed, in the kernel. Both are
  # recorded because they are independent walls and a future change (a bigger
  # gmu, a kernel fix) moves only one of them. Neither is a licence to raise the
  # window without a probe.
  #
  # Superseded note, wrong but instructive: an earlier revision set 480K here on
  # the memory arithmetic alone. It booted, allocated, and served short prompts —
  # and could not serve its own window. Raise this value with a long-prefill
  # needle probe, never with arithmetic.
  #
  # If you do want more window, --max-num-batched-tokens is the lever for the
  # MEMORY wall (it is what the indexer workspace scales with; it took GLM-5.2
  # from 256K to 320K). It does NOT move the 48-CTA kernel wall, which is set by
  # sequence length and GB10's SM count. That one needs a kernel fix upstream.
  max_model_len: 327680
  max_num_seqs: 6
  # Speculative decoding via the checkpoint's OWN multi-token-prediction head —
  # issue #26. No external drafter, so no extra weights and no extra licence.
  #
  # The head is real and in this quant: layer 45, one beyond `num_hidden_layers:
  # 45`, carrying eh_proj / enorm / hnorm / shared_head.norm. Those four are
  # unique to a nextn layer. NOTE the obvious check misleads — grepping tensor
  # names for "nextn"/"mtp"/"draft" returns ZERO hits because GLM names the
  # layer positionally, and concluding from that the head is absent would push
  # you to DFlash2 (an unmerged vLLM PR plus a CC-BY-NC-ND draft against an MIT
  # target), which is not needed.
  #
  # 4 draft tokens: the value the published TP4 config uses.
  #
  # MEASURED at this setting (2026-08-30, spark-02 + spark-03):
  #     decode      22.4 and 26.0 tok/s over two runs, vs 14.3 without MTP
  #                 (same 600-token prompt) -> 1.57x to 1.82x
  #     acceptance  874 accepted / 1,924 drafted over 481 drafts = 45.4%,
  #                 i.e. 1.82 accepted per step, so ~2.82 tokens per engine step
  #     per-position  pos0 363 (75%), pos1 252 (52%), pos2 157 (33%), pos3 102 (21%)
  #     KV pool     554,535 tokens (was 1,015,403) — the draft head costs about
  #                 half the pool; concurrency 3.10x -> 1.69x. This is why #24
  #                 had to be measured BEFORE turning MTP on.
  #     window      still served with the pool halved: needle RE-RUN with MTP on
  #                 at 294,828 prompt tokens, retrieved verbatim, finish=stop,
  #                 cold prefill 1,307 tok/s (1,311 without MTP — drafting does
  #                 not cost prefill). Arithmetic (554,535 > 327,680) was NOT
  #                 accepted as sufficient: this file says elsewhere that a
  #                 window is proven by probe and never by arithmetic, and
  #                 halving the pool is exactly the change that rule exists for.
  #     probes      both trick questions still answered correctly with MTP on
  #                 ("all but 9" -> 9 sheep; 3 machines/3 widgets -> 3 minutes).
  #                 Recorded because a bad drafter degrades quality rather than
  #                 erroring, so this is the check that catches a SILENT failure.
  #
  # Note the gap between the 2.82x tokens-per-step and the 1.57-1.82x actually
  # observed: that is the cost of the draft forward pass. Raising this number
  # buys less than the acceptance table suggests, because every extra draft
  # token is paid for whether or not it is accepted. pos3 still lands 21% of the
  # time, so 4 is not obviously too many — but tune against
  # vllm:spec_decode_num_{accepted,draft}_tokens_total, never by intuition, and
  # re-check the KV pool afterwards.
  #
  # THE 45.4% ABOVE IS THE PESSIMISTIC CASE. Sampled mid-GPQA under batch load
  # (see BENCHMARKS at the foot of this file), acceptance was 255,458/356,264 =
  # **71.7%**, with ~98-106 tok/s aggregate throughput across ~8 sequences vs
  # 22-26 tok/s single-stream. Long chain-of-thought is far more predictable for
  # the draft head than the short prose answers the 45.4% was measured on, so
  # MTP is worth materially more on reasoning workloads than the single-stream
  # figure suggests. Which number applies depends entirely on your traffic.
  num_speculative_tokens: 4
  # 2304 = 9 x 256. Load-bearing: must be a multiple of BOTH 256 (index pool
  # alignment) and 128 (MLA alignment). Not a tuning knob — changing it to a
  # "rounder" number breaks one of the two alignments.
  block_size: 2304
  served_model_name: glm-5.3-flash
env:
  # FlashInfer autotunes its kernel variants on first boot with no cached result.
  # That presents as a 60+ minute "No available shared memory broadcast block
  # found" loop with the worker at 150%+ CPU. It is NOT a hang. The caches are
  # container-local (this fleet has scar tissue about JIT caches on NFS — see the
  # GLM-5.2 load failures), so budget it on every cold launch, not just the first.
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  # The overlay pins FlashInfer to a nightly (0.6.18.dev20260819); its own version
  # check rejects the pin it needs.
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  NCCL_NVLS_ENABLE: "0"
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
command: |
  vllm serve {model} \
      --served-model-name {served_model_name} \
      --host {host} \
      --port {port} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --block-size {block_size} \
      --moe-backend marlin \
      --kv-cache-dtype fp8_e4m3 \
      --enforce-eager \
      --tool-call-parser glm47 \
      --enable-auto-tool-choice \
      --reasoning-parser glm45 \
      --default-chat-template-kwargs '{"reasoning_effort":"high"}' \
      --speculative-config '{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}'
#
# ------------------------------- LOAD-BEARING ---------------------------------
#
# --moe-backend marlin
#   THE most important flag in this file. Left to auto-select, vLLM picks
#   FLASHINFER_CUTLASS for the NVFP4 MoE, which on GB10 produces degenerate
#   output — repeated-token loops from the very first generated token — with
#   ZERO errors. The model loads, /health passes, the gateway publishes it, and
#   every completion is garbage. This is the silent-degradation case Principle 3
#   exists for, so it is pinned rather than discovered.
#
# --enforce-eager
#   CUDA graphs are not viable on this stack. Costs decode speed and is the first
#   thing to revisit once the deploy is stable — but it is what upstream measured,
#   and "it booted without graphs" is a different claim from "it works with them".
#
# --kv-cache-dtype fp8_e4m3
#   Requires overlay layer v8 (EFF_CTA_TILE_KV capped at 32 for GB10's ~101 KB
#   opt-in smem). Without v8 this dies in warmup with cudaFuncSetAttribute
#   "invalid argument". Do not enable fp8 KV against a partially-built overlay.
#
# --default-chat-template-kwargs '{"reasoning_effort":"high"}'
#   Pinned because the template's own fallback is `max`, the most expensive
#   setting, which nobody chose. ACCEPTED VALUES ARE ONLY {low, high} — there is
#   no "medium" here, and an unrecognised value does NOT error, it silently
#   becomes `max`. Full derivation, the template source, and what `max` cost us
#   are under CHAT TEMPLATE at the foot of this file. Read that before changing
#   this value, and do not copy the qwen3.8 recipes' "medium" across.
#
# Deliberately NOT set: --kv-cache-memory-bytes. Every GLM-5.2 recipe here pins
# it, which makes omitting it look like an oversight. It is not — upstream is
# explicit that vLLM should auto-compute the pool for this model, and a hand-set
# value is how you get a pool that allocates and then fails under load.
#
# --------------------------- SPECULATIVE DECODING -----------------------------
#
# Native MTP, enabled and measured — issue #26. Decode 22.4-26.0 tok/s against a
# 14.3 baseline. For scale, the figures published for this model at TP2 are
# 24.7 code / 30.3 structured / 19.6 prose — but ours is ONE 600-token prose
# prompt, so it is not a like-for-like comparison and should not be quoted as
# matching them. Full numbers sit with num_speculative_tokens in the defaults
# block above, next to the knob they justify.
#
# The alternative, DFlash2 via incoai/GLM-5.3-Flash-DFlash2, is what upstream
# actually measured here — and is NOT needed. It would cost a ninth overlay
# layer porting an UNMERGED vLLM PR (#52816) plus a CC-BY-NC-ND-4.0 draft
# checkpoint against an MIT target. Native MTP needs neither: the head ships
# inside the quant. Do not reach for DFlash2 without a reason that survives
# those two costs.
#
# Ordering mattered and would again: the draft head takes roughly half the KV
# pool, so this had to be measured AFTER the context ceiling in #24 rather than
# alongside it, or neither measurement would have meant anything.
#
# ------------------------------ MULTIMODAL ------------------------------------
#
# This is the first natively multimodal model on the cluster (image + video).
# Vision requests additionally need `--chat-template chat_template_mm.jinja`,
# which is NOT set here — text-only is the smaller, testable first step, and the
# gateway publishes a text completion surface today regardless.
#
# ------------------------------- CHAT TEMPLATE --------------------------------
#
# GLM-5.3 defaults `clear_thinking` to FALSE. That is not pinned here — it has
# not been validated against this quant's template.
#
# =================== reasoning_effort IS PINNED, TO "high" ====================
# Read straight off this checkpoint's chat_template.jinja, line 2, which is the
# authoritative source and disagrees with the vendor blog posts:
#
#   {%- set effective_reasoning_effort = reasoning_effort
#         if reasoning_effort is defined and reasoning_effort in ['low','high']
#         else 'max' -%}
#
# TWO TRAPS LIVE IN THAT ONE LINE.
#
# 1. The default is `max` — the most expensive setting there is, reachable only
#    as a FALLBACK. Nobody chose it; it is what you get by not deciding.
#
# 2. The accepted set is ONLY {low, high}. `max` is not even in it. And unlike
#    Qwen — whose template raise_exception()s on an unrecognised value, so a
#    mistake is loud — this template SILENTLY falls back to max. So passing
#    "medium", which is what BOTH qwen3.8 recipes here pin, would look applied
#    and give you the maximum. Do not copy that value across.
#
# WHAT EACH INPUT ACTUALLY DOES, exhaustively — there is no other branch:
#
#     caller sends            effective_reasoning_effort   system line emitted
#     --------------------    --------------------------   -------------------
#     "low"                   low                          Reasoning Effort: Low
#     "high"                  high                         Reasoning Effort: High
#     "medium"                max      <- SILENT           Reasoning Effort: Max
#     "max"                   max      <- SILENT           Reasoning Effort: Max
#     "xhigh" / anything      max      <- SILENT           Reasoning Effort: Max
#     (not sent at all)       max                          Reasoning Effort: Max
#
# The template then emits, at line 3, a system turn:
#     <|system|>Reasoning Effort: {{ effective_reasoning_effort | capitalize }}
# so the level is steered by a system message, not a sampling parameter. That is
# why it can only be set through the chat template and not through the OpenAI
# request body directly.
#
# Every row that lands on `max` is indistinguishable at the API from a correct
# request. There is no error, no warning, and no field in the response that
# reports the level in force — which is the whole reason this is pinned at the
# server rather than left to callers, and why issue #57 exists.
#
# What max was costing us, measured on this deployment before pinning:
#     GPQA-Diamond   23 of 198 items (11.6%) returned null content, having blown
#                    past even the 32k cap. qwen3.8 at its pinned medium: 2/198.
#     mean generation ~8,874 tokens per GPQA item
#     tool-eval-full  responsiveness 28 of 100, mean 19.3 s per scenario, one at
#                    100 s — near GLM-5.2's 32, and far below the small models
#                    (Qwen3.5-9B 86, Mistral-Small-24B 93). MTP did not fix this
#                    because the cost is tokens generated, not tokens per second.
#
# "high", not "low", because high is the sane middle of an accepted set of two —
# the analogue of qwen's medium. `low` remains available per request.
#
# Per-request override: chat_template_kwargs={"reasoning_effort":"low"|"high"}.
# --default-chat-template-kwargs is the only way to reach lm-eval, which cannot
# send chat_template_kwargs — the same reason the qwen3.8 recipes use it.
# =============================================================================
#
# --reasoning-parser stays glm45, matching upstream. Do NOT "fix" this to
# deepseek_r1 — that was tried and measured, and it changes nothing. See #25.
#
# The temptation is real: this quant's chat_template.jinja ends
#     {%- if add_generation_prompt -%}
#         <|assistant|>{{- '<think>' -}}
#     {%- endif -%}
# so `<think>` is the last PROMPT token — generation starts INSIDE the reasoning
# span and the model only ever emits the closing `</think>`. That is the
# DeepSeek-R1 convention, and LibertAI's own model card recommends deepseek_r1
# for this export on exactly that reasoning.
#
# It does not matter. Measured back-to-back on identical prompts at temp 0:
#     glm45       -> reasoning 311 chars, content 402, completion_tokens 317
#     deepseek_r1 -> reasoning 311 chars, content 404, completion_tokens 314
# glm45 splits this template correctly already.
#
# The bug report that prompted the change was a MEASUREMENT error, not a model
# defect: it read `reasoning_content`, which this vLLM does not return. The
# field is `reasoning`. Reading the wrong key yields empty for every parser,
# which then looks like "the reasoning was silently discarded". Nothing is
# discarded. If you are auditing token accounting here, note also that this
# markdown output runs ~2.28 chars/token, not 4.
#
# ------------------------------- BENCHMARKS -----------------------------------
#
# GPQA-Diamond (CoT, zero-shot) — MEASURED AT BOTH EFFORT LEVELS.
# Same harness, same seed, same caps; ONLY --default-chat-template-kwargs changed.
#
#     reasoning_effort   score            nulls          duration
#     high (SHIPPED)     77.27 +/- 2.99   7/198  (3.5%)  1.79h   [2026-08-31]
#     max  (old default) 81.31 +/- 2.78   23/198 (11.6%) 5.60h   [2026-08-30]
#
#   preset acc-gpqa-diamond-full-longgen, 198/198, seed 42, maxGenToks 32768,
#   numConcurrent 16, timeout 7200s, 0 timeouts on both runs.
#
# THE TRADE, stated honestly: 4.04 points for 3.1x the speed.
#
#   The drop is NOT statistically established. 81.31 +/- 2.78 and 77.27 +/- 2.99
#   overlap across 78.5-80.1; 4.04 points against ~2.9-point standard errors is
#   about 1 sigma on 198 items. Do not quote "max is 4 points better" as fact.
#
#   And part of the gap is mechanical rather than capability: every null scores
#   WRONG, and max carried 16 more of them. So max's 81.31 was measured while
#   auto-failing 11.6% of items, and high's true capability deficit is probably
#   smaller than 4.04. BOTH numbers remain floors.
#
#   high is shipped because 3.1x faster at ~1 sigma is the right trade for
#   interactive use, and because it fixes the failures that actually bite:
#   tool-eval responsiveness 28/100, and 11.6% of long answers silently
#   returning nothing. Pick max only if a headline benchmark number is the
#   goal — and note that 81.31 was itself depressed by its own nulls.
#
# THIRD REASON BOTH NUMBERS ARE FLOORS: no answer-format instruction.
#
#   GPQA's prompt never states an answer format — doc_to_text ends "Let's think
#   step by step: " — while the strict-match filter demands the literal "The
#   answer is ". A model that reasons correctly and phrases the conclusion its
#   own way scores ZERO however right it is. This model's strict-match is 0.0354
#   against a flexible-extract of 0.7727, i.e. it essentially never writes the
#   expected envelope and the whole score rests on the looser filter.
#
#   How large that effect can be, measured on this cluster: Muse Glimmer wrote
#   "This is choice B", matched NEITHER filter, and scored 22.73 — against a
#   published 83.5. Instructing the format lifted the same model to 82.83 on the
#   same 198 items (2026-08-31). A 60-point swing from formatting, not capability.
#
#   Do NOT expect a swing that large here. Muse Glimmer's flexible-extract had
#   failed outright; ours works (0.7727). Our remaining upside is only whatever
#   flexible-extract still misses, which is unmeasured. But it is upside, not
#   noise, and it is a third independent reason these numbers understate.
#
#   Both runs above are UN-INSTRUCTED, which is correct: that is what makes them
#   comparable to GLM-5.2 67.68, DeepSeek 55.05 and Qwen3.8 76.77, all measured
#   the same way. An instructed run is a DIFFERENT MEASUREMENT and must never be
#   compared against them. `acc-gpqa-diamond-full-longgen-formatted` exists for
#   that purpose as a distinct preset id — it needs a server rebuild to appear,
#   since presets are compiled in.
#
# WANTED: a clean `max` measurement. Both runs were capped at maxGenToks 32768,
# which is what generates the nulls — at reasoning_effort=max this model needs
# more than that for ~12% of GPQA. At TP4 the context ceiling rises far above
# 320K (see #58), so the generation cap could be raised well past 32k and a max
# run would lose most of its auto-failures. That is the measurement that would
# settle whether max is genuinely better or merely less penalised. Until then,
# treat the 4-point gap as unresolved.
#
# For context, measured on this same cluster:
#     qwen3.8-27b (bf16 and nvfp4)   76.77   longgen 32k
#     GLM-5.2 quanttrio dcp2 320k    67.68   full 4k   <- SEE CAVEAT
#     deepseek-v4-flash              55.05   full 4k
#     muse-glimmer-30b               22.73   longgen 32k
#
# CAVEAT on the GLM-5.2 comparison: 67.68 was measured with a 4k generation cap.
# That cap badly suppresses reasoning models — muse-glimmer went 10.61 -> 22.73
# on the identical task purely by moving 4k -> 32k. GLM-5.2's number is very
# likely understated, so the +13.6 gap is an UPPER bound until GLM-5.2 is re-run
# at longgen. Do not quote it as a like-for-like result.
#
# 81.31 IS A FLOOR, NOT A POINT ESTIMATE. The run log carries 23 occurrences of
# "returned null content" — 11.6% of items produced nothing extractable and were
# scored WRONG rather than skipped. Those are the long tail hitting the 32,768
# cap: at reasoning_effort=max (the default), 32k is still not enough for about
# an eighth of GPQA. A larger cap would probably raise this number.
#
# Read the flexible-extract metric, not strict-match. strict-match reads 0.0354
# here, which measures answer-format compliance, not capability: the model
# reasons at length and rarely emits the exact expected envelope. qwen3.8-27b
# shows the same split (0.0202 strict / 0.7677 flexible), so this is a property
# of the harness, not of GLM.
#
# REPRODUCING IT — the eval config is load-bearing, not incidental:
#   - timeout MUST exceed queue wait + generation. The 1800s default livelocks:
#     items needing ~2340s of generation time out, get retried, and the retries
#     stack on live work until throughput collapses. Our first attempt showed
#     122 server-side completions against 53 counted by the client before it was
#     killed. Comparing those two counters is how you detect this; GPU
#     utilisation looks perfectly healthy throughout.
#   - numConcurrent 16 with a matching --max-num-seqs 16 override at deploy time
#     (the shipped recipe serves at 6). vLLM still only admits ~8 at a 32k
#     reservation, so KV is the real limit; raising max_num_seqs further does
#     nothing without more pool.
#   - serial (numConcurrent 1) projects 21-30h. Batched: 5h37m.
